
services:
  geonetwork:
    volumes:
      # client-specific customisations
      # osmp
      - ../iso19139.osmp/src/main/plugin/iso19139.osmp:/var/lib/jetty/webapps/geonetwork/WEB-INF/data/config/schema_plugins/iso19139.osmp
      - ../iso19139.osmp/src/main/config/translations/en-schema-iso19139.osmp.json:/var/lib/jetty/webapps/geonetwork/catalog/locales/en-schema-iso19139.osmp.json
