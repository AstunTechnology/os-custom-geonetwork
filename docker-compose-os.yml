      #- ./ordnance-survey/catalog/locales/en-core.json:/var/lib/jetty/webapps/geonetwork/catalog/locales/en-core.json
      #- ./ordnance-survey/catalog/locales/en-editor.json:/var/lib/jetty/webapps/geonetwork/catalog/locales/en-editor.json
      #- ./ordnance-survey/catalog/locales/en-gnui.json:/var/lib/jetty/webapps/geonetwork/catalog/locales/en-gnui.json
      #- ./ordnance-survey/catalog/locales/en-v4.json:/var/lib/jetty/webapps/geonetwork/catalog/locales/en-v4.json
      # gemini 2.3 overrides for NGD
      - ./geonetwork/WEB-INF/data/config/schema_plugins/iso19139.gemini23/layout/config-editor.xml:/var/lib/jetty/webapps/geonetwork/WEB-INF/data/config/schema_plugins/iso19139.gemini23/layout/config-editor.xml
